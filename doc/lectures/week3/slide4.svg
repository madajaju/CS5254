<?plantuml 1.2026.2?><svg contentStyleType='text/css' data-diagram-type='DESCRIPTION' height='637px' preserveAspectRatio='none' style='width:256px;height:637px;background:#FFFFFF;' version='1.1' viewBox='0 0 256 637' width='256px' xmlns:xlink='http://www.w3.org/1999/xlink' xmlns='http://www.w3.org/2000/svg' zoomAndPan='magnify'><title>The Integrity Packet</title><defs/><g><g class='title' data-source-line='1'><text fill='#000000' font-family='sans-serif' font-size='14' font-weight='bold' lengthAdjust='spacing' textLength='133.041' x='54.6377' y='24.0752'>The Integrity Packet</text></g><g class='entity' data-qualified-name='Weak' data-source-line='6' id='ent0002'><rect fill='#F1F1F1' height='71.4541' rx='9' ry='9' style='stroke:#181818;stroke-width:0.5;' width='191.2061' x='33.06' y='45.1514'/><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='171.2061' x='43.06' y='69.2266'>Weak Engineering Thinking</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='43.06' y='86.3779'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='155.4287' x='43.06' y='103.5293'>\"I will test concurrency.\"</text></g><g class='entity' data-qualified-name='Better' data-source-line='8' id='ent0003'><rect fill='#F1F1F1' height='71.4541' rx='9' ry='9' style='stroke:#181818;stroke-width:0.5;' width='241.5391' x='7.89' y='176.6114'/><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='172.7715' x='17.89' y='200.6866'>Better Engineering Thinking</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='17.89' y='217.8379'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='221.5391' x='17.89' y='234.9893'>\"I will stress test multiple workers.\"</text></g><g class='entity' data-qualified-name='Strong' data-source-line='10' id='ent0004'><rect fill='#F1F1F1' height='88.6055' rx='9' ry='9' style='stroke:#181818;stroke-width:0.5;' width='199.2588' x='29.03' y='308.0614'/><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='174.3232' x='39.03' y='332.1366'>Strong Operational Thinking</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='39.03' y='349.2879'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='179.2588' x='39.03' y='366.4393'>\"No duplicate fills may occur</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='148.9482' x='39.03' y='383.5907'>under concurrent load.\"</text></g><g class='entity' data-qualified-name='AAOS' data-source-line='12' id='ent0005'><rect fill='#F1F1F1' height='174.3623' rx='9' ry='9' style='stroke:#181818;stroke-width:0.5;' width='243.3164' x='7' y='456.6714'/><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='149.3994' x='17' y='480.7466'>AAOS Integrity Thinking</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='17' y='497.8979'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='223.3164' x='17' y='515.0493'>Claim: FIFO ordering is guaranteed.</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='17' y='532.2007'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='209.3096' x='17' y='549.352'>Evidence: Concurrent stress tests</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='194.5303' x='17' y='566.5034'>maintain deterministic ordering.</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='3.8896' x='17' y='583.6548'>&#160;</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='182.0957' x='17' y='600.8061'>Escalation: Ordering violation</text><text fill='#000000' font-family='sans-serif' font-size='14' lengthAdjust='spacing' textLength='150.1992' x='17' y='617.9575'>triggers operational halt.</text></g><g class='link' data-entity-1='ent0002' data-entity-2='ent0003' data-link-type='dependency' data-source-line='14' id='lnk6'><path d='M128.66,116.9114 C128.66,135.3314 128.66,151.8514 128.66,170.2714' fill='none' id='Weak-to-Better' style='stroke:#181818;stroke-width:1;'/><polygon fill='#181818' points='128.66,176.2714,132.66,167.2714,128.66,171.2714,124.66,167.2714,128.66,176.2714' style='stroke:#181818;stroke-width:1;'/></g><g class='link' data-entity-1='ent0003' data-entity-2='ent0004' data-link-type='dependency' data-source-line='15' id='lnk7'><path d='M128.66,248.5214 C128.66,266.4914 128.66,282.5314 128.66,301.5914' fill='none' id='Better-to-Strong' style='stroke:#181818;stroke-width:1;'/><polygon fill='#181818' points='128.66,307.5914,132.66,298.5914,128.66,302.5914,124.66,298.5914,128.66,307.5914' style='stroke:#181818;stroke-width:1;'/></g><g class='link' data-entity-1='ent0004' data-entity-2='ent0005' data-link-type='dependency' data-source-line='16' id='lnk8'><path d='M128.66,396.8414 C128.66,414.5414 128.66,429.6514 128.66,450.2514' fill='none' id='Strong-to-AAOS' style='stroke:#181818;stroke-width:1;'/><polygon fill='#181818' points='128.66,456.2514,132.66,447.2514,128.66,451.2514,124.66,447.2514,128.66,456.2514' style='stroke:#181818;stroke-width:1;'/></g><?plantuml-src XP4nRy8m48Nt_8eJEqZTAePA5569fQa4KfSi9-TmJd7EoBw0-FUz4A2XIsLvEVjzp-zPMGF1lY7OYf9Fh1VuGjUI5aLkMOwOi8FSO1tFB1uE639DJbBifNOn2ILuUIsAH4vHl35dtuGjRCIp4AL1kszOJEWhiJNRmfb30AMiuAAuFYKITrbKinbWXa7zX7idLJFv5vWrKSuZj-k3yj7KvvXQIlaE7rbF-9scQCZoI0cLes3uW_-CKFV7m0wLu61E6JgyG7Jsyagi1NlS8uT2Y